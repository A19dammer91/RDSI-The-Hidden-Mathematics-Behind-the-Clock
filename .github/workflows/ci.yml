name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # --------------------------------------------------------------- 1. test
  test:
    name: pytest · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tests (excl. slow)
        run: pytest -m "not slow" --cov=rd --cov-report=xml --cov-report=term
      - name: Run slow invariants
        run: pytest -m "slow"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------ 2. quality
  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests code
      - name: Format check
        run: ruff format --check src tests code
      - name: Type check
        run: mypy

  # ------------------------------------------------------- 3. branchless gate
  branchless-gate:
    name: Branchless core
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Enforce branchless core
        run: pytest tests/test_branchless.py -v --no-cov

  # ------------------------------------------------------ 4. oracle parity
  oracle-parity:
    name: 1-based vs oracle · q in {7,9,12,24,60}
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Cross-check all cycle lengths
        run: pytest tests/test_transition.py -v --no-cov -k "oracle or parity"

  # -------------------------------------------------- 5. verification scripts
  scripts:
    name: code/ verification scripts
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Foundation
        run: python code/verify_foundation.py --max 50000 --quiet
      - name: Ladder
        run: python code/verify_ladder.py --max 2000 --quiet
      - name: Clock
        run: python code/verify_clock.py --days 1 --random 50000 --quiet
      - name: Oracle comparison
        run: python code/compare_oracle.py --steps 1000

  # ------------------------------------------------------- 6. build check
  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    needs: [test, scripts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build
      - name: Build
        run: python -m build
      - name: Verify metadata
        run: |
          python -m pip install dist/*.whl
          python -c "import rd; print('rd', rd.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
