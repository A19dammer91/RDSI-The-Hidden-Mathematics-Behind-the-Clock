[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rdsi-1-based-cycle"
version = "1.0.1"
description = "Representation Domain: 1-based cycle algebra, Diophantine ladder, and clock cascade."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Bilal El Issaoui", email = "a19dammer91@users.noreply.github.com" }]
keywords = ["diophantine", "modular-arithmetic", "clock", "representation", "off-by-one"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
rdsi = "rd.__main__:main"

[project.urls]
Homepage = "https://github.com/A19dammer91/RDSI-The-Hidden-Mathematics-Behind-the-Clock"
Paper = "https://doi.org/10.5281/zenodo.23077746"
Demo = "https://a19dammer91.github.io/RDSI-The-Hidden-Mathematics-Behind-the-Clock/"
Issues = "https://github.com/A19dammer91/RDSI-The-Hidden-Mathematics-Behind-the-Clock/issues"
Changelog = "https://github.com/A19dammer91/RDSI-The-Hidden-Mathematics-Behind-the-Clock/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/rd"]

[tool.hatch.build.targets.sdist]
include = ["src/rd", "tests", "code", "README.md", "CITATION.cff", "LICENSE"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: exhaustive sweeps that take a long time (Frobenius sweep, full-day clock sweep)",
  "invariant: hard invariants from the RDSI paper",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["rd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"code/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["rd"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rd"]
warn_unreachable = true
disallow_any_unimported = true
