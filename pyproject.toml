[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rd"
version = "0.1.0"
description = "Representation Domain: 1-based cycle algebra, Diophantine ladder, and clock cascade."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "Bilal El Issaoui", email = "a19dammer91@users.noreply.github.com" }]
keywords = ["diophantine", "modular-arithmetic", "clock", "representation", "off-by-one"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
rd = "rd.__main__:main"

[project.urls]
Homepage = "https://github.com/A19dammer91/the-exact-algebraic-condition-for-clock-behaviour"
Paper = "https://doi.org/10.5281/zenodo.23077746"
Changelog = "https://github.com/A19dammer91/the-exact-algebraic-condition-for-clock-behaviour/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/rd"]

[tool.hatch.build.targets.sdist]
include = ["src/rd", "tests", "README.md", "CITATION.cff", "LICENSE"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: tests die >1s duren (Frobenius-sweep, 200k clock-sweep)",
  "invariant: harde invarianten uit §5.5 van het paper",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["rd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["rd"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rd"]
warn_unreachable = true
disallow_any_unimported = true
